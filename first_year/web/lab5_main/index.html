<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="traffic-light">
        <div class="light" id="red"></div>
        <div class="light" id="yellow"></div>
        <div class="light" id="green"></div>
    </div>

    <h2 id="message">Світлофор вимкнений</h2>

    <div class="buttons">
        <button id="redButton">Червоний</button>
        <button id="yellowButton">Жовтий</button>
        <button id="greenButton">Зелений</button>
        <button id="autoButton">Автоматично</button>
        <button id="stopButton">Зупинити</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
